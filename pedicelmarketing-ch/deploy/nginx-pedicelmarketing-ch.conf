# pedicelmarketing.ch - static site on spire (Scaleway Dedibox 62.210.212.199).
#
# Install (operator, after the domain's A records point at this box):
#   sudo cp deploy/nginx-pedicelmarketing-ch.conf /etc/nginx/sites-available/pedicelmarketing-ch
#   sudo ln -s /etc/nginx/sites-available/pedicelmarketing-ch /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/pedicelmarketing-ch
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pedicelmarketing.ch -d www.pedicelmarketing.ch
#
# HTTP ONLY for now. `certbot --nginx` adds the :443 server block, the cert paths,
# the ssl_* includes and the http->https redirect on first issue (see how
# /etc/nginx/sites-enabled/pedicelmarketing.conf looks for the .com). Do not hand-write them.
#
# This file reuses two http-level objects that the .com vhost
# (/etc/nginx/sites-enabled/pedicelmarketing.conf) already declares:
#   - limit_req_zone  pedicel_forms   (5 r/m per IP)
#   - map             $pedicel_cache  (Cache-Control by content type)
# nginx rejects a duplicate zone/map name, so they are NOT redeclared here.
# Consequence: the .com vhost must stay enabled, or move both into a shared conf.
#
# Layout of /var/www/pedicelmarketing-ch (from `python3 build.py`):
#   /            German        /fr/...  French        /en/...  English
#   /404/ /fr/404/ /en/404/ (noindex)   /404.html   /assets/   /sitemap.xml   /robots.txt
# /assets/* gets the year-long immutable cache: build.py adds ?v=<content hash> to every
# reference, so a changed file is a new URL.
# Photos/fonts captured from the old site are NOT copied: /_external/ is served
# straight from the .com web root (one copy, content-hashed names).

server {
    server_name pedicelmarketing.ch www.pedicelmarketing.ch;
    root /var/www/pedicelmarketing-ch;
    index index.html;

    # Bound to the PUBLIC IP only (same as the .com): cannot collide with
    # Tailscale's :443 or the internal core-oss vhost on 127.0.0.1:8088.
    listen 62.210.212.199:80;

    access_log /var/log/nginx/pedicelmarketing-ch.access.log;
    error_log  /var/log/nginx/pedicelmarketing-ch.error.log;

    # www -> apex. $scheme is http in this block now; certbot copies this server
    # into the :443 block it creates, where $scheme evaluates to https.
    if ($host = www.pedicelmarketing.ch) {
        return 301 $scheme://pedicelmarketing.ch$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml font/otf application/font-sfnt;

    # Photos, fonts and scripts captured from the old site: reuse the .com copy.
    location /_external/ {
        alias /var/www/pedicelmarketing/_external/;
        add_header Cache-Control $pedicel_cache always;
        include snippets/pedicel-security.conf;
        try_files $uri =404;
    }

    # Form relay -> form_handler.py (serves /api/forms/ch-audit and /api/forms/ch-contact).
    location /api/forms/ {
        limit_req zone=pedicel_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Directory-index clean URLs: /fr/audit/ -> fr/audit/index.html.
    # 404s answer in the language of the URL: /nope -> /404/, /fr/nope -> /fr/404/,
    # /en/nope -> /en/404/ (status stays 404; the 404 pages are noindex).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control $pedicel_cache always;
        include snippets/pedicel-security.conf;
    }
    location /fr/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control $pedicel_cache always;
        include snippets/pedicel-security.conf;
        error_page 404 /fr/404/index.html;
    }
    location /en/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control $pedicel_cache always;
        include snippets/pedicel-security.conf;
        error_page 404 /en/404/index.html;
    }

    error_page 404 /404/index.html;
}
